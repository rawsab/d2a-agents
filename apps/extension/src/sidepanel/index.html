<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>D2A Recorder</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>D2A Recorder</h1>
      <span id="conn" class="conn"><span class="dot"></span><span class="label">Server offline</span></span>
    </header>

    <section id="record">
      <div class="row">
        <input id="name" placeholder="Name this recording" />
        <button id="toggle" class="primary">Record</button>
      </div>
    </section>

    <section id="live" hidden>
      <h2><span class="rec-dot"></span>Recording: <span id="live-name"></span></h2>
      <ol id="live-steps" class="steps"></ol>
    </section>

    <section id="run" hidden>
      <div class="row between">
        <h2 id="run-title"></h2>
        <div class="row">
          <button id="run-pause" class="ghost">Pause</button>
          <button id="run-stop" class="ghost danger">Stop</button>
        </div>
      </div>
      <p id="run-status" class="hint"></p>
      <ul id="run-heals" class="heals"></ul>
      <ol id="run-items" class="items"></ol>
      <details>
        <summary class="hint">Log</summary>
        <ol id="run-log" class="log"></ol>
      </details>
    </section>

    <section id="workflows">
      <div class="row between">
        <h2>Workflows</h2>
      </div>
      <ul id="workflow-list" class="recordings"></ul>
    </section>

    <section id="library">
      <div class="row between">
        <h2>Recordings</h2>
        <button id="refresh" class="ghost">Refresh</button>
      </div>
      <ul id="recordings" class="recordings"></ul>
    </section>

    <section id="detail" hidden>
      <div class="row between">
        <button id="back" class="ghost">← Back</button>
        <button id="delete" class="ghost danger">Delete</button>
      </div>
      <h2 id="detail-name"></h2>
      <div class="automate">
        <textarea id="instruction" rows="2" placeholder="What should be repeated? e.g. Repeat for every video in the playlist"></textarea>
        <button id="compile" class="primary">Automate</button>
        <p id="compile-status" class="hint"></p>
        <div id="compiled" hidden>
          <p id="compiled-summary"></p>
          <ol id="compiled-steps" class="plan"></ol>
          <ul id="compiled-notes" class="notes"></ul>
          <div id="followup" class="followup">
            <div id="compiled-questions"></div>
            <textarea id="change-request" rows="2" placeholder="Anything to change? e.g. Skip videos that were already downloaded"></textarea>
            <button id="refine">Update automation</button>
            <p id="refine-status" class="hint"></p>
          </div>
          <div class="row">
            <button id="compiled-dry">Dry run (1 item)</button>
            <button id="compiled-run" class="primary">Run all</button>
          </div>
        </div>
      </div>
      <h2>Recorded steps</h2>
      <ol id="detail-steps" class="steps"></ol>
    </section>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
