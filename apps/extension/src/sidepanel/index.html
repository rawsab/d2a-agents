<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>D2A Recorder</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>D2A Recorder</h1>
      <span id="conn" class="conn"><span class="dot"></span><span class="label">Server offline</span></span>
    </header>

    <section id="record">
      <div class="row">
        <input id="name" placeholder="Name this recording" />
        <button id="toggle" class="primary">Record</button>
      </div>
    </section>

    <section id="live" hidden>
      <h2><span class="rec-dot"></span>Recording: <span id="live-name"></span></h2>
      <ol id="live-steps" class="steps"></ol>
    </section>

    <section id="run" hidden>
      <div class="row between">
        <h2 id="run-title"></h2>
        <div class="row">
          <button id="run-pause" class="ghost">Pause</button>
          <button id="run-stop" class="ghost danger">Stop</button>
        </div>
      </div>
      <p id="run-status" class="hint"></p>
      <ol id="run-items" class="items"></ol>
      <details>
        <summary class="hint">Log</summary>
        <ol id="run-log" class="log"></ol>
      </details>
    </section>

    <section id="workflows">
      <div class="row between">
        <h2>Workflows</h2>
      </div>
      <ul id="workflow-list" class="recordings"></ul>
    </section>

    <section id="library">
      <div class="row between">
        <h2>Recordings</h2>
        <button id="refresh" class="ghost">Refresh</button>
      </div>
      <ul id="recordings" class="recordings"></ul>
    </section>

    <section id="detail" hidden>
      <div class="row between">
        <button id="back" class="ghost">← Back</button>
        <button id="delete" class="ghost danger">Delete</button>
      </div>
      <h2 id="detail-name"></h2>
      <ol id="detail-steps" class="steps"></ol>
    </section>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
