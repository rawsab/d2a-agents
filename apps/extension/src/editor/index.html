<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workflow editor</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="bar">
      <input id="name" class="name" aria-label="Workflow name" />
      <span id="state" class="state"></span>
      <div class="spacer"></div>
      <button id="revert" class="ghost" hidden>Discard changes</button>
      <button id="save" class="primary" disabled>Save</button>
      <span class="sep"></span>
      <button id="dry">Dry run (1 item)</button>
      <button id="run">Run all</button>
    </header>

    <section id="ask" class="ask">
      <textarea id="request" rows="1" placeholder="Ask Claude to change it, e.g. “skip videos longer than an hour” or “click the 720p option before Download”"></textarea>
      <button id="ask-go">Ask Claude</button>
      <p id="ask-status" class="hint"></p>
    </section>

    <section id="proposal" class="proposal" hidden>
      <div class="row">
        <strong>Claude's proposal</strong>
        <span class="hint">Added, changed and removed steps are marked below. Nothing is saved until you accept.</span>
        <div class="spacer"></div>
        <button id="proposal-discard" class="ghost">Discard</button>
        <button id="proposal-accept" class="primary">Accept</button>
      </div>
      <p id="proposal-summary"></p>
      <ul id="proposal-notes" class="notes"></ul>
    </section>

    <ul id="problems" class="problems"></ul>

    <main>
      <section class="timeline">
        <details id="settings" class="settings">
          <summary>Tabs and options</summary>
          <div id="settings-body"></div>
        </details>
        <ol id="steps" class="steps"></ol>
      </section>
      <aside id="inspector" class="inspector"></aside>
    </main>

    <div id="picker" class="picker" hidden></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
