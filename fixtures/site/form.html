<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixture Downloader</title>
    <style>body { font: 14px system-ui, sans-serif; margin: 24px; }</style>
  </head>
  <body>
    <h1>Fixture Downloader</h1>
    <form id="dl">
      <label for="url">Paste link</label>
      <input id="url" name="url" size="40" />
      <button type="submit">Download</button>
    </form>
    <p id="status" role="status"></p>
    <script>
      // ?ads=1 opens an "ad" tab on another origin with every download, like many converter sites.
      const params = new URLSearchParams(location.search);
      const ads = params.has("ads");
      // ?relabel=<text> renames the Download button after the first download, like a site redesign mid-run.
      const relabel = params.get("relabel");
      document.getElementById("dl").addEventListener("submit", async (e) => {
        e.preventDefault();
        if (ads) window.open(`http://localhost:${location.port}/ad.html`, "_blank");
        const url = document.getElementById("url").value;
        await fetch("/log", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ url }) });
        document.getElementById("status").textContent = `Queued ${url}`;
        document.getElementById("url").value = "";
        if (relabel) document.querySelector("#dl button").textContent = relabel;
      });
    </script>
  </body>
</html>
